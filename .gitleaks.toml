title = "ThreatFade Gitleaks configuration"

[extend]
useDefault = true

# Narrow line-pattern suppressions for verified generic-api-key false positives.
# The empty API-key assignment is a placeholder, not credential material. The
# JWKS pattern selects a public signing key by kid; the local variable name
# "key" is not a secret. These patterns do not suppress other findings in the
# historical commits where the lines first appeared.
[allowlist]
description = "Narrow verified historical generic-api-key false-positive line patterns"
regexTarget = "line"
regexes = [
  '^\s*def __init__\(self, key_material: Ed25519PrivateKey \| None = None\):\s*$',
  '^\s*THREATFADE_API_KEY=\s*$',
  '^\s*kid=jwt\.get_unverified_header\(token\)\.get\("kid"\); key=next\(\(k for k in self\._load_jwks\(\)\.get\("keys",\[\]\) if k\.get\("kid"\)==kid\),None\)$',
]
