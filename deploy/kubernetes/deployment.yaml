apiVersion: apps/v1
kind: Deployment
metadata:
  name: threatfade
spec:
  replicas: 2
  selector:
    matchLabels:
      app: threatfade
  template:
    metadata:
      labels:
        app: threatfade
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: threatfade
          image: tinlance/threatfade:latest
          ports:
            - containerPort: 8080
          env:
            - name: THREATFADE_ENV
              value: production
            - name: THREATFADE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: threatfade-secrets
                  key: api-key
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: threatfade
spec:
  selector:
    app: threatfade
  ports:
    - port: 80
      targetPort: 8080
