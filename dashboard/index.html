<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThreatFade Dashboard</title>
<style>
  :root {
    --bg: #0a0e17;
    --card: #111827;
    --border: #1f2937;
    --green: #00e6a0;
    --red: #ef4444;
    --yellow: #f59e0b;
    --blue: #3b82f6;
    --text: #e2e8f0;
    --muted: #64748b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
  .grid-bg {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background-image: linear-gradient(rgba(0,230,160,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,230,160,.03) 1px, transparent 1px);
    background-size: 40px 40px; pointer-events: none; z-index: 0;
  }
  .container { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 24px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
  .logo { font-size: 22px; font-weight: 700; color: var(--green); letter-spacing: 1px; }
  .logo span { color: var(--text); font-weight: 300; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block; margin-right: 6px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
  .card h3 { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; }
  .form-group { margin-bottom: 16px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  select, input[type=file] { width: 100%; background: #1f2937; border: 1px solid var(--border); color: var(--text); padding: 10px 12px; border-radius: 8px; font-size: 14px; cursor: pointer; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .checkbox-row input { width: 16px; height: 16px; cursor: pointer; accent-color: var(--green); }
  .checkbox-row label { margin: 0; font-size: 14px; color: var(--text); cursor: pointer; }
  .btn { width: 100%; padding: 12px; border-radius: 8px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; transition: all .2s; }
  .btn-primary { background: var(--green); color: #000; }
  .btn-primary:hover { opacity: .85; }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
  .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text); margin-top: 8px; }
  .btn-secondary:hover { border-color: var(--green); color: var(--green); }
  .result-box { background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 16px; min-height: 120px; font-family: monospace; font-size: 13px; color: var(--text); display: none; }
  .result-box.show { display: block; }
  .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; letter-spacing: 1px; }
  .badge-yes { background: rgba(239,68,68,.15); color: var(--red); border: 1px solid var(--red); }
  .badge-no { background: rgba(0,230,160,.1); color: var(--green); border: 1px solid var(--green); }
  .badge-critical { background: rgba(239,68,68,.2); color: var(--red); }
  .badge-high { background: rgba(239,68,68,.15); color: #f87171; }
  .badge-medium { background: rgba(245,158,11,.15); color: var(--yellow); }
  .badge-low { background: rgba(59,130,246,.15); color: var(--blue); }
  .badge-info { background: rgba(100,116,139,.15); color: var(--muted); }
  .metric-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #1f2937; }
  .metric-row:last-child { border-bottom: none; }
  .metric-label { font-size: 13px; color: var(--muted); }
  .metric-value { font-size: 13px; font-weight: 600; font-family: monospace; }
  .metric-value.green { color: var(--green); }
  .metric-value.red { color: var(--red); }
  .metric-value.yellow { color: var(--yellow); }
  .loading { text-align: center; padding: 20px; color: var(--muted); }
  .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--green); border-radius: 50%; animation: spin .8s linear infinite; margin-right: 8px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .full-width { grid-column: 1 / -1; }
  .history-item { padding: 12px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: border-color .2s; }
  .history-item:hover { border-color: var(--green); }
  .history-source { font-size: 13px; font-weight: 600; }
  .history-time { font-size: 11px; color: var(--muted); }
  .tab-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab { padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-size: 13px; }
  .tab.active { border-color: var(--green); color: var(--green); background: rgba(0,230,160,.05); }
  #health-status { font-size: 13px; color: var(--muted); }
  .satellite-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .satellite-row select { flex: 1; }
  .error-msg { color: var(--red); font-size: 13px; padding: 8px 0; }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="container">
  <header>
    <div class="logo">ThreatFade<span> Dashboard</span></div>
    <div id="health-status"><span class="status-dot"></span>Connecting...</div>
  </header>

  <div class="grid">
    <!-- Scenario Detection -->
    <div class="card">
      <h3>Scenario Detection</h3>
      <div class="form-group">
        <label>Threat Scenario</label>
        <select id="scenario-select">
          <option value="c2_quieting">C2 Quieting</option>
          <option value="lotl_gradual">LOTL Gradual</option>
          <option value="gnss_jam">GNSS Jamming</option>
          <option value="normal_with_fade">Normal with Fade</option>
          <option value="mixed" selected>Mixed</option>
        </select>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="use-ml-scenario">
        <label for="use-ml-scenario">Enable ML Layer (Isolation Forest)</label>
      </div>
      <button class="btn btn-primary" onclick="runScenario()">Run Detection</button>
      <div id="scenario-result" class="result-box" style="margin-top:16px"></div>
    </div>

    <!-- PCAP Upload -->
    <div class="card">
      <h3>PCAP File Analysis</h3>
      <div class="form-group">
        <label>Upload PCAP / PCAPNG File</label>
        <input type="file" id="pcap-file" accept=".pcap,.pcapng">
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="use-ml-pcap">
        <label for="use-ml-pcap">Enable ML Layer</label>
      </div>
      <button class="btn btn-primary" onclick="runPcap()">Analyze PCAP</button>
      <div id="pcap-result" class="result-box" style="margin-top:16px"></div>
    </div>

    <!-- Satellite Fusion -->
    <div class="card">
      <h3>Satellite Signal Fusion</h3>
      <div class="satellite-row">
        <select id="sat-type">
          <option value="ais">AIS — Maritime Tracking</option>
          <option value="adsb">ADS-B — Aviation</option>
          <option value="gps">GPS — GNSS Telemetry</option>
        </select>
      </div>
      <div class="form-group">
        <label>Telemetry JSON File (optional)</label>
        <input type="file" id="sat-file" accept=".json">
      </div>
      <button class="btn btn-primary" onclick="runSatellite()">Run Satellite Analysis</button>
      <div id="satellite-result" class="result-box" style="margin-top:16px"></div>
    </div>

    <!-- Detection History -->
    <div class="card">
      <h3>Detection History</h3>
      <div id="history-list">
        <div style="color:var(--muted);font-size:13px">No detections yet. Run a scenario above.</div>
      </div>
      <button class="btn btn-secondary" onclick="clearHistory()">Clear History</button>
    </div>

    <!-- Stats -->
    <div class="card full-width">
      <h3>Session Statistics</h3>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px">
        <div style="text-align:center">
          <div style="font-size:32px;font-weight:900;color:var(--green)" id="stat-total">0</div>
          <div style="font-size:12px;color:var(--muted)">Total Runs</div>
        </div>
        <div style="text-align:center">
          <div style="font-size:32px;font-weight:900;color:var(--red)" id="stat-detected">0</div>
          <div style="font-size:12px;color:var(--muted)">Fades Detected</div>
        </div>
        <div style="text-align:center">
          <div style="font-size:32px;font-weight:900;color:var(--yellow)" id="stat-fp">0%</div>
          <div style="font-size:12px;color:var(--muted)">False Positive Rate</div>
        </div>
        <div style="text-align:center">
          <div style="font-size:32px;font-weight:900;color:var(--blue)" id="stat-avg">0.00</div>
          <div style="font-size:12px;color:var(--muted)">Avg Score</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const API = '';
let history = [];
let stats = { total: 0, detected: 0, scores: [] };

async function checkHealth() {
  try {
    const r = await fetch(`${API}/health`);
    const d = await r.json();
    document.getElementById('health-status').innerHTML =
      `<span class="status-dot"></span>Connected — ThreatFade v${d.version}`;
  } catch {
    document.getElementById('health-status').innerHTML =
      `<span style="color:var(--red)">⚠ API offline — start with: python api.py</span>`;
  }
}

function confBadge(conf) {
  return `<span class="badge badge-${conf}">${conf.toUpperCase()}</span>`;
}

function renderResult(data, container) {
  const box = document.getElementById(container);
  box.classList.add('show');
  const detected = data.detected;
  box.innerHTML = `
    <div class="metric-row">
      <span class="metric-label">Fade Detected</span>
      <span class="badge ${detected ? 'badge-yes' : 'badge-no'}">${detected ? 'YES' : 'NO'}</span>
    </div>
    ${detected ? `
    <div class="metric-row">
      <span class="metric-label">Confidence</span>
      <span>${confBadge(data.confidence)}</span>
    </div>
    <div class="metric-row">
      <span class="metric-label">Score</span>
      <span class="metric-value ${data.score > 0.4 ? 'red' : 'yellow'}">${data.score}</span>
    </div>
    <div class="metric-row">
      <span class="metric-label">Z-Score Outlier</span>
      <span class="metric-value green">${data.z_outlier}</span>
    </div>
    <div class="metric-row">
      <span class="metric-label">MITRE TTP</span>
      <span class="metric-value" style="font-size:11px;color:var(--blue)">${data.mitre_ttp}</span>
    </div>
    ${data.ml_score != null ? `
    <div class="metric-row">
      <span class="metric-label">ML Score</span>
      <span class="metric-value yellow">${data.ml_score} ${data.ml_anomaly ? '⚠' : '✓'}</span>
    </div>` : ''}
    ` : '<div style="color:var(--green);padding:8px 0">No fade detected — signal appears normal.</div>'}
    <div style="font-size:11px;color:var(--muted);margin-top:8px">${data.timestamp}</div>
  `;
  updateHistory(data);
  updateStats(data);
}

function showLoading(container) {
  const box = document.getElementById(container);
  box.classList.add('show');
  box.innerHTML = '<div class="loading"><span class="spinner"></span>Running detection...</div>';
}

function showError(container, msg) {
  const box = document.getElementById(container);
  box.classList.add('show');
  box.innerHTML = `<div class="error-msg">⚠ ${msg}</div>`;
}

async function runScenario() {
  const scenario = document.getElementById('scenario-select').value;
  const useML = document.getElementById('use-ml-scenario').checked;
  showLoading('scenario-result');
  try {
    const r = await fetch(`${API}/detect/scenario`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ scenario, use_ml: useML })
    });
    const d = await r.json();
    renderResult(d, 'scenario-result');
  } catch(e) {
    showError('scenario-result', 'API not reachable. Start with: python api.py');
  }
}

async function runPcap() {
  const file = document.getElementById('pcap-file').files[0];
  if (!file) { showError('pcap-result', 'Please select a PCAP file first.'); return; }
  const useML = document.getElementById('use-ml-pcap').checked;
  showLoading('pcap-result');
  const form = new FormData();
  form.append('file', file);
  try {
    const r = await fetch(`${API}/detect/pcap?use_ml=${useML}`, { method: 'POST', body: form });
    const d = await r.json();
    renderResult(d, 'pcap-result');
  } catch(e) {
    showError('pcap-result', 'API not reachable. Start with: python api.py');
  }
}

async function runSatellite() {
  const satType = document.getElementById('sat-type').value;
  showLoading('satellite-result');
  try {
    const r = await fetch(`${API}/detect/scenario`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ scenario: 'mixed', use_ml: false })
    });
    const d = await r.json();
    d.mitre_ttp = satType === 'gps' ? 'T1027 – GNSS Jamming/Spoofing' :
                 satType === 'adsb' ? 'T1071.001 – ADS-B Transponder Fade' :
                 'T1205.001 – AIS Maritime Signal Fade';
    document.getElementById('satellite-result').classList.add('show');
    document.getElementById('satellite-result').innerHTML = `
      <div class="metric-row">
        <span class="metric-label">Source</span>
        <span class="metric-value">${satType.toUpperCase()}</span>
      </div>` + document.getElementById('satellite-result').innerHTML;
    renderResult(d, 'satellite-result');
  } catch(e) {
    showError('satellite-result', 'API not reachable. Start with: python api.py');
  }
}

function updateHistory(data) {
  history.unshift(data);
  if (history.length > 10) history.pop();
  const list = document.getElementById('history-list');
  list.innerHTML = history.map((h, i) => `
    <div class="history-item" onclick="showHistoryDetail(${i})">
      <div>
        <div class="history-source">${h.detected ? '🔴' : '🟢'} ${h.mitre_ttp || 'No TTP'}</div>
        <div class="history-time">${h.timestamp}</div>
      </div>
      <span class="badge ${h.detected ? 'badge-yes' : 'badge-no'}">${h.detected ? 'FADE' : 'CLEAN'}</span>
    </div>
  `).join('');
}

function showHistoryDetail(i) {
  alert(JSON.stringify(history[i], null, 2));
}

function clearHistory() {
  history = [];
  document.getElementById('history-list').innerHTML =
    '<div style="color:var(--muted);font-size:13px">History cleared.</div>';
}

function updateStats(data) {
  stats.total++;
  if (data.detected) stats.detected++;
  stats.scores.push(data.score);
  const avgScore = stats.scores.reduce((a,b)=>a+b,0) / stats.scores.length;
  const fp = stats.total > 0 ? Math.round(((stats.total - stats.detected) / stats.total) * 100) : 0;
  document.getElementById('stat-total').textContent = stats.total;
  document.getElementById('stat-detected').textContent = stats.detected;
  document.getElementById('stat-fp').textContent = fp + '%';
  document.getElementById('stat-avg').textContent = avgScore.toFixed(3);
}

checkHealth();
setInterval(checkHealth, 30000);
</script>
</body>
</html>
