name: ThreatFade CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: threatfade-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test-python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.11'
          - '3.12'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: threatfade
          POSTGRES_PASSWORD: threatfade_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U threatfade -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      THREATFADE_ENV: development
      TEST_DATABASE_URL: postgresql+psycopg://threatfade:threatfade_ci@localhost:5432/threatfade_test
      TEST_DATABASE_ADMIN_URL: postgresql+psycopg://threatfade:threatfade_ci@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile sources
        run: python -m compileall -q core scripts tests benchmarks
      - name: Validate security architecture
        run: python scripts/validate_security_architecture.py
      - name: Validate identity architecture
        run: python scripts/validate_identity_architecture.py
      - name: Validate detection science architecture
        run: python scripts/validate_detection_science.py
      - name: Validate corpus governance
        run: python scripts/validate_corpus_architecture.py
      - name: Validate supply-chain architecture
        run: python scripts/validate_supply_chain.py
      - name: Validate ground truth
        run: python scripts/validate_ground_truth.py
      - name: Validate reliability architecture
        run: python scripts/validate_reliability.py
      - name: Verify Alembic state on clean PostgreSQL database
        run: |
          psql "postgresql://threatfade:threatfade_ci@localhost:5432/postgres" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = 'threatfade_schema_check' AND pid <> pg_backend_pid();
          DROP DATABASE IF EXISTS threatfade_schema_check;
          CREATE DATABASE threatfade_schema_check;
          SQL
          THREATFADE_DATABASE_URL=postgresql+psycopg://threatfade:threatfade_ci@localhost:5432/threatfade_schema_check alembic upgrade head
          THREATFADE_DATABASE_URL=postgresql+psycopg://threatfade:threatfade_ci@localhost:5432/threatfade_schema_check alembic check
          psql "postgresql://threatfade:threatfade_ci@localhost:5432/postgres" -v ON_ERROR_STOP=1 -c "DROP DATABASE threatfade_schema_check;"
      - name: Run test suite twice
        run: |
          python -m pytest -q
          python -m pytest -q
      - name: Run benchmark smoke test
        run: python benchmarks/benchmark.py
      - name: Run Detection Science 2.0 benchmark
        run: python benchmarks/detection_science_v2.py
      - name: Run adversarial benchmark
        run: python benchmarks/adversarial.py
      - name: Validate detection pack
        run: |
          python -c "from core.detection_pack import detection_pack, validate_pack; validate_pack(detection_pack()); print('detection pack: OK')"
          python -c "from tests.test_detection_pack_platform import manifest; from core.detection_pack_platform import validate_manifest; validate_manifest(manifest()); print('pack manifest: OK')"
      - name: Enterprise smoke checks
        run: python scripts/enterprise_smoke.py
