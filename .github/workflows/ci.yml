name: ThreatFade CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: threatfade-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_BASE_TAG: 3.12.14-slim-trixie

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Validate security architecture baseline
        run: python scripts/validate_security_architecture.py
      - name: Validate identity and tenant security architecture
        run: python scripts/validate_identity_architecture.py
      - name: Validate detection science architecture
        run: python scripts/validate_detection_science.py
      - name: Validate corpus governance architecture
        run: python scripts/validate_corpus_architecture.py
      - name: Validate supply-chain architecture
        run: python scripts/validate_supply_chain.py
      - name: Validate ground-truth corpus contract
        run: python scripts/validate_ground_truth.py
      - name: Validate reliability architecture
        run: python scripts/validate_reliability.py
      - name: Validate disaster recovery architecture
        run: python scripts/validate_disaster_recovery.py
      - name: Run complete test suite
        run: pytest -q
      - name: Run reproducible benchmark
        run: python benchmarks/benchmark.py
      - name: Run Detection Science 2.0 synthetic benchmark
        run: python benchmarks/detection_science_v2.py
      - name: Run adversarial synthetic benchmark
        run: python benchmarks/adversarial.py
      - name: Validate detection pack
        run: |
          python -c "from core.detection_pack import detection_pack, validate_pack; validate_pack(detection_pack()); print('detection pack: OK')"
          python -c "from tests.test_detection_pack_platform import manifest; from core.detection_pack_platform import validate_manifest; validate_manifest(manifest()); print('pack manifest: OK')"
      - name: Enterprise and dashboard smoke checks
        run: python scripts/enterprise_smoke.py
      - name: Resolve current Python base digest
        id: base
        shell: bash
        run: |
          docker pull "python:${PYTHON_BASE_TAG}"
          ref="$(docker image inspect "python:${PYTHON_BASE_TAG}" --format '{{index .RepoDigests 0}}')"
          digest="${ref##*@}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Invalid base digest: $digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Build production container
        run: docker build --pull --build-arg PYTHON_BASE_TAG="$PYTHON_BASE_TAG" --build-arg PYTHON_BASE_DIGEST="${{ steps.base.outputs.digest }}" -t threatfade:ci .

  phase7-performance:
    name: phase7-performance-${{ matrix.target_pps }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target_pps: [10000, 100000, 500000]
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install benchmark dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Import smoke test
        run: python -c "from core.data_plane import BoundedEventQueue, SignalEvent; print('data-plane import: OK')"
      - name: Run sustained benchmark
        run: python benchmarks/phase7_benchmark.py --target-pps ${{ matrix.target_pps }} --duration 10 --output phase7-${{ matrix.target_pps }}.json
      - name: Upload benchmark result
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase7-${{ matrix.target_pps }}
          path: phase7-${{ matrix.target_pps }}.json
          if-no-files-found: error

  postgres-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}
      THREATFADE_DATABASE_URL: postgresql+psycopg://threatfade:threatfade@localhost:5432/threatfade
      THREATFADE_APP_DATABASE_URL: postgresql+psycopg://threatfade_app:threatfade_app@localhost:5432/threatfade
      THREATFADE_RESTORE_DATABASE_URL: postgresql+psycopg://threatfade:threatfade@localhost:5432/threatfade_restore
      THREATFADE_POSTGRES_MAJOR: '16'
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_USER: threatfade
          POSTGRES_PASSWORD: threatfade
          POSTGRES_DB: threatfade
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U threatfade -d threatfade"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Apply production migration
        run: alembic upgrade head
      - name: Resolve current migration head
        run: echo "THREATFADE_MIGRATION_HEAD=$(alembic current | awk '/\(head\)/ {print $1; exit}')" >> "$GITHUB_ENV"
      - name: Assert migration head resolved
        run: test -n "$THREATFADE_MIGRATION_HEAD"
      - name: Create least-privileged application role
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text
          import os
          engine = create_engine(os.environ['THREATFADE_DATABASE_URL'])
          with engine.begin() as conn:
              conn.execute(text("DO $$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'threatfade_app') THEN CREATE ROLE threatfade_app LOGIN PASSWORD 'threatfade_app' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS; END IF; END $$;"))
              conn.execute(text("GRANT CONNECT ON DATABASE threatfade TO threatfade_app"))
              conn.execute(text("GRANT USAGE ON SCHEMA public TO threatfade_app"))
              conn.execute(text("GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO threatfade_app"))
              conn.execute(text("GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO threatfade_app"))
          print('least-privileged application role: OK')
          PY
      - name: Validate PostgreSQL integrity and tenant isolation as application role
        env:
          THREATFADE_DATABASE_URL: ${{ env.THREATFADE_APP_DATABASE_URL }}
        run: python scripts/validate_postgres_integrity.py
      - name: Create logical recovery artifact
        run: python scripts/backup.py ./recovery-artifact
      - name: Verify recovery artifact checksum and catalog
        shell: bash
        run: |
          archive=$(find recovery-artifact -name '*.dump' -type f | head -n 1)
          manifest=$(find recovery-artifact -name '*.manifest.json' -type f | head -n 1)
          test -n "$archive" && test -n "$manifest"
          python scripts/restore_verify.py "$archive" "$manifest"
          echo "RECOVERY_ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Create isolated restore database
        run: |
          PGPASSWORD=threatfade psql -h localhost -U threatfade -d postgres -v ON_ERROR_STOP=1 -c 'DROP DATABASE IF EXISTS threatfade_restore WITH (FORCE);'
          PGPASSWORD=threatfade psql -h localhost -U threatfade -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE threatfade_restore;'
      - name: Restore and verify isolated database
        run: python scripts/restore_drill.py "$RECOVERY_ARCHIVE" --target-url "$THREATFADE_RESTORE_DATABASE_URL" --expected-revision "$THREATFADE_MIGRATION_HEAD"
      - name: Cleanup restore database
        if: always()
        run: PGPASSWORD=threatfade psql -h localhost -U threatfade -d postgres -v ON_ERROR_STOP=1 -c 'DROP DATABASE IF EXISTS threatfade_restore WITH (FORCE);'
