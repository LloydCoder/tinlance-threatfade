name: ThreatFade Supply Chain

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: threatfade-supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lloydcoder/tinlance-threatfade

jobs:
  build-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build immutable CI image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: threatfade:ci-${{ github.sha }}
          provenance: true
          sbom: true

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: threatfade:ci-${{ github.sha }}
          format: spdx-json
          output-file: threatfade.sbom.spdx.json
          artifact-name: threatfade-sbom-${{ github.sha }}.spdx.json

      - name: Scan SBOM for high/critical vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: threatfade.sbom.spdx.json
          fail-build: true
          severity-cutoff: high

      - name: Scan Dockerfile and Kubernetes configuration
        uses: aquasecurity/trivy-action@57a97c7c5a0a0f2d0c2d6d4f1b8f5c4a0a7d2c6e # v0.35.0
        with:
          scan-type: config
          hide-progress: true
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivy-config: trivy.yaml

      - name: Validate ThreatFade supply-chain policy
        run: python scripts/validate_supply_chain.py

      - name: Render-test digest-pinned production manifest
        run: |
          python scripts/render_production_manifest.py \
            "ghcr.io/lloydcoder/tinlance-threatfade@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" \
            /tmp/threatfade-production.yaml
          grep -Eq '@sha256:[0-9a-f]{64}' /tmp/threatfade-production.yaml

      - name: Upload SBOM as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: threatfade-sbom-${{ github.sha }}
          path: threatfade.sbom.spdx.json
          if-no-files-found: error
          retention-days: 30

  release-attest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and publish immutable commit image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: mode=max
          sbom: true

      - name: Generate build provenance attestation
        uses: actions/attest@508db9585e2f6c31f5f8b5b0d2a3e2f0a2f5e0f1 # v4.2.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM attestation
        uses: actions/attest@508db9585e2f6c31f5f8b5b0d2a3e2f0a2f5e0f1 # v4.2.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: threatfade.sbom.spdx.json
          push-to-registry: true
