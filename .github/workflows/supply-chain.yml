name: ThreatFade Supply Chain

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: threatfade-supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lloydcoder/tinlance-threatfade
  PYTHON_BASE_TAG: 3.14.7-slim-trixie

jobs:
  build-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Resolve current Python base digest
        id: base
        shell: bash
        run: |
          docker pull "python:${PYTHON_BASE_TAG}"
          ref="$(docker image inspect "python:${PYTHON_BASE_TAG}" --format '{{index .RepoDigests 0}}')"
          digest="${ref##*@}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Invalid base digest: $digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Build immutable CI image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: threatfade:ci-${{ github.sha }}
          build-args: |
            PYTHON_BASE_TAG=${{ env.PYTHON_BASE_TAG }}
            PYTHON_BASE_DIGEST=${{ steps.base.outputs.digest }}
          provenance: false
          sbom: false
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: threatfade:ci-${{ github.sha }}
          format: spdx-json
          output-file: threatfade.sbom.spdx.json
          artifact-name: threatfade-sbom-${{ github.sha }}.spdx.json
      - name: Scan SBOM for remediable high/critical vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: threatfade.sbom.spdx.json
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - name: Scan Dockerfile and Kubernetes configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          hide-progress: true
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivy-config: trivy.yaml
      - name: Validate ThreatFade supply-chain policy
        run: python scripts/validate_supply_chain.py
      - name: Render-test digest-pinned production manifest
        run: |
          python scripts/render_production_manifest.py \
            "ghcr.io/lloydcoder/tinlance-threatfade@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" \
            /tmp/threatfade-production.yaml
          grep -Eq '@sha256:[0-9a-f]{64}' /tmp/threatfade-production.yaml
      - name: Upload SBOM as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: threatfade-sbom-${{ github.sha }}
          path: threatfade.sbom.spdx.json
          if-no-files-found: error
          retention-days: 30

  release-attest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Resolve current Python base digest
        id: base
        shell: bash
        run: |
          docker pull "python:${PYTHON_BASE_TAG}"
          ref="$(docker image inspect "python:${PYTHON_BASE_TAG}" --format '{{index .RepoDigests 0}}')"
          digest="${ref##*@}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Invalid base digest: $digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Build and publish immutable commit image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            PYTHON_BASE_TAG=${{ env.PYTHON_BASE_TAG }}
            PYTHON_BASE_DIGEST=${{ steps.base.outputs.digest }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: mode=max
          sbom: true
      - name: Generate SPDX SBOM for released image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: spdx-json
          output-file: threatfade.sbom.spdx.json
          artifact-name: threatfade-release-sbom-${{ github.sha }}.spdx.json
      - name: Generate build provenance attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Generate SBOM attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: threatfade.sbom.spdx.json
          push-to-registry: true
