name: One-time enterprise route integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message != 'chore: integrate enterprise routes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply integration
        run: python scripts/apply_enterprise_routes.py
      - name: Remove one-time tooling
        run: |
          rm -f scripts/apply_enterprise_routes.py .github/workflows/one-time-enterprise-route-integration.yml
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api.py scripts/apply_enterprise_routes.py .github/workflows/one-time-enterprise-route-integration.yml
          git diff --cached --quiet && exit 0
          git commit -m 'chore: integrate enterprise routes'
          git push
