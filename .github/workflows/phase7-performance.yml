name: Phase 7 Performance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        events: [10000, 100000, 500000]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run deterministic benchmark
        run: python benchmarks/phase7_benchmark.py --events ${{ matrix.events }} --duration 10 --output phase7-${{ matrix.events }}.json
      - name: Upload benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: phase7-${{ matrix.events }}
          path: phase7-${{ matrix.events }}.json
          if-no-files-found: error
