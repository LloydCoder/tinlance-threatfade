name: ThreatFade Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: threatfade-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_BASE_TAG: 3.12.14-slim-trixie

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve current Python base digest
        id: base
        shell: bash
        run: |
          docker pull "python:${PYTHON_BASE_TAG}"
          ref="$(docker image inspect "python:${PYTHON_BASE_TAG}" --format '{{index .RepoDigests 0}}')"
          digest="${ref##*@}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Invalid base digest: $digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Build and push immutable image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          build-args: |
            PYTHON_BASE_TAG=${{ env.PYTHON_BASE_TAG }}
            PYTHON_BASE_DIGEST=${{ steps.base.outputs.digest }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Generate build provenance attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image keylessly
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: cosign sign --yes ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}
      - name: Verify image signature
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: cosign verify ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}
