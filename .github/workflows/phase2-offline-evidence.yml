name: ThreatFade Phase 2 Offline Evidence

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: threatfade-phase2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Phase 2 sources
        run: python -m compileall -q core scripts tests
      - name: Run Phase 2 unit tests
        run: pytest -q tests/test_offline_transport.py tests/test_transport_protocol.py
      - name: Run Phase 2 validation gate
        run: python scripts/validate_phase2.py
