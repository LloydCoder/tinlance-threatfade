name: Phase 8 Detection Science Experiments

on:
  pull_request:
    paths:
      - 'core/ml_*.py'
      - 'tests/test_ml_*.py'
      - 'datasets/**'
      - 'docs/PHASE_8*'
      - '.github/workflows/phase8-ml-experiments.yml'
      - '.github/workflows/supply-chain.yml'
      - 'Dockerfile'
      - 'scripts/validate_supply_chain.py'
  push:
    branches: [main]
    paths:
      - 'core/ml_*.py'
      - 'tests/test_ml_*.py'
      - 'datasets/**'
      - 'docs/PHASE_8*'
      - '.github/workflows/phase8-ml-experiments.yml'
      - '.github/workflows/supply-chain.yml'
      - 'Dockerfile'
      - 'scripts/validate_supply_chain.py'

permissions:
  contents: read

jobs:
  ml-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run governed ML experiment tests
        run: python -m pytest -q tests/test_ml_experiments.py tests/test_ml_governance.py
      - name: Reject production model promotion without evidence
        run: |
          python - <<'PY'
          from core.ml_experiments import DatasetManifest, evaluate_baseline, promotion_gate
          import numpy as np
          rng = np.random.default_rng(42)
          benign_a = rng.normal(size=(15, 8))
          attack_a = rng.normal(3.0, 1.0, size=(5, 8))
          benign_b = rng.normal(size=(10, 8))
          attack_b = rng.normal(3.0, 1.0, size=(5, 8))
          benign_c = rng.normal(size=(5, 8))
          X = np.vstack([benign_a, attack_a, benign_b, attack_b, benign_c])
          y = np.array([0] * 15 + [1] * 5 + [0] * 10 + [1] * 5 + [0] * 5)
          manifest = DatasetManifest('ci-governance-fixture', '1', 'deterministic CI fixture')
          baseline = evaluate_baseline(X, y, manifest)
          gated = promotion_gate(baseline, baseline)
          assert not gated.production_candidate
          print('No experimental model promoted: comparative evidence/governance requirements are enforced.')
          PY
