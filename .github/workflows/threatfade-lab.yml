name: ThreatFade Lab

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install lab dependency
        run: python -m pip install --disable-pip-version-check "scapy>=2.7.0"

      - name: Generate deterministic fixtures
        run: python lab/generate_scenarios.py --scenario all

      - name: Validate fixtures
        run: python lab/validate_scenarios.py
